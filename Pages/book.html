<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Css/BookATable.css">

</head>

<body>

    <header class="header">

        <div class="logo">
            <img src="../Images/Logo.png">
            <span>CAT CAFÉ</span>
        </div>

        <nav class="nav">
            <a href="home.html">Home</a>
        </nav>

        <div class="right">
            <a href="FaqPage.html">FAQ</a>
            <img src="../Images/login.png" class="icon">
        </div>

        <div class="menu-btn">
            <img src="../Images/burger-bar.png">
        </div>

    </header>


    <section class="main">

        <div class="container">


            <div class="form-text">

                <h2>Booking Form</h2>
                <p>Please fill in the details below to reserve your visit:</p>


                <form id="bookingForm">

                    <table class="form-table">

                        <tr>
                            <td>Name:</td>
                            <td><input type="text" id="name"></td>
                        </tr>

                        <tr>
                            <td>Email Address:</td>
                            <td><input type="email" id="email"></td>
                        </tr>

                        <tr>
                            <td>Phone Number:</td>
                            <td><input type="text" id="phone"></td>
                        </tr>

                        <tr>
                            <td>Number of Guests:</td>
                            <td><input type="number" id="guests"></td>
                        </tr>

                        <tr>
                            <td>Select Date:</td>
                            <td><input type="date" id="date"></td>
                        </tr>

                        <tr>
                            <td>Select Time:</td>
                            <td><input type="time" id="time"></td>
                        </tr>

                    </table>

                    <br>

                    <button type="submit" class="btn">Send</button>

                    <p id="error" style="color:red;"></p>

                </form>

            </div>


            <div class="image">
                <img src="../Images/BookATableImg.png">
            </div>

        </div>

        <a href="BookATable.html">
            <button class="btn">Back</button>
        </a>

    </section>


    <footer class="footer">
        <a href="BookATable.html">Book a visit to the cafe</a>
        <a>FAQs</a>
        <a>Delivery & Returns</a>
        <a>Our Mission</a>
        <a>Contact us</a>
    </footer>

    <script>

        document.getElementById("bookingForm").addEventListener("submit", function (e) {

            e.preventDefault();

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let phone = document.getElementById("phone").value;
            let guests = document.getElementById("guests").value;
            let date = document.getElementById("date").value;
            let time = document.getElementById("time").value;

            let error = document.getElementById("error");

            if (name === "" || email === "" || phone === "" || guests === "" || date === "" || time === "") {
                error.textContent = "Please fill in all fields!";
            } else {
                error.textContent = "";
                alert("Booking successful! Thank you for reserving your visit to Cat Café. We look forward to welcoming you and your guests on " + date + " at " + time + ".");
            }

        });

    </script>

</body>

</html>
